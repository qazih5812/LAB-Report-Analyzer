# ==============================================================================
# Render.com Blueprint Specification for CityLab Diagnostics
# Deploy via: Render Dashboard -> Blueprints -> New Blueprint Instance
# ==============================================================================

services:
  - type: web
    name: citylab-report-explainer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
